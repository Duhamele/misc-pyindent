[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyindent"
version = "0.1.0"
requires-python = ">=3.10"
license="GPL-3.0-only"
dependencies = []
authors=[
    { name= "Elie Duhamel"}
]
[tool.setuptools.packages.find]
where=["src"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "mypy",
    "build",
    "twine"
]